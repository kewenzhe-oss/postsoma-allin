<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local gameplay audit</title></head><body><div id="app"></div><script type="module">
import showdown from './engine-showdown.json';
import gameover from './engine-game-over.json';
import {createApp,h} from 'vue';import {createPinia} from 'pinia';import {createRouter,createMemoryHistory,RouterView} from 'vue-router';import ElementPlus from 'element-plus';import 'element-plus/dist/index.css';import '../../src/style.css';import Room from '../../src/views/Room.vue';import {useOnlineStore} from '../../src/stores/online.js';
const pinia=createPinia();const store=useOnlineStore(pinia);store.initFromSession=()=>{};store.connectWebSocket=()=>{};store.leaveRoom=()=>{};store.playerToken='fixture';store.playerId='hero';store.roomId='fixture';
const players=[{player_id:'hero',display_name:'Player 1',chips:1140,bet_in_round:0,folded:false},{player_id:'ai_seat',display_name:'Custom AI',chips:820,bet_in_round:20,folded:false}];
function scenario(name){if(name==='Refresh'){store.availableActions=structuredClone(store.availableActions);return;}store.errorMessage='';store.absentPlayers={};store.latestHandResult=null;store.latestGameResult=null;store.isGameOverPending=false;store.connectionStatus='connected';store.privateState={hole_cards:['7h','2h']};store.publicState={game_status:'in_hand',stage:'flop',pot:40,current_bet:20,current_turn_player_id:'hero',dealer_player_id:'hero',players:structuredClone(players),community_cards:['3h','Js','6d']};store.availableActions=[{action:'FOLD'},{action:'CALL',amount:20},{action:'RAISE',min_amount:40,max_amount:1140},{action:'ALL_IN',amount:1140}];if(name==='AI')store.publicState.current_turn_player_id='ai_seat';if(name==='Human')store.publicState.current_turn_player_id='friend';if(name==='Refresh')store.availableActions=structuredClone(store.availableActions);if(name==='Result'){store.publicState=structuredClone(showdown.state);store.privateState=structuredClone(showdown.private);store.latestHandResult=structuredClone(showdown.result);}if(name==='GameOver'){store.publicState=structuredClone(gameover.state);store.latestHandResult=structuredClone(gameover.result);store.latestGameResult=structuredClone(gameover.game);}if(name==='Left')store.absentPlayers={ai_seat:'left'};if(name==='Disconnect')store.connectionStatus='connecting';}
store.submitAction=(action,amount)=>{store.rawEventLog.push({type:'player_action_applied',payload:{player_id:'hero',action,amount}});store.publicState.current_turn_player_id='ai_seat'};scenario(new URLSearchParams(location.search).get('preview') || 'Hero');
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/room/:id',name:'Room',component:Room},{path:'/',name:'Home',component:{render:()=>h('div','Home')}}]});await router.push('/room/fixture');await router.isReady();
createApp({render:()=>h('div',[h('div',{style:new URLSearchParams(location.search).has('preview')?'display:none':'position:fixed;right:0;top:60px;z-index:9999;display:flex;gap:2px;opacity:.7'},['Hero','AI','Human','Refresh','Result','GameOver','Left','Disconnect'].map(name=>h('button',{onClick:()=>scenario(name),'aria-label':`Test ${name}`},name))),h(RouterView)])}).use(pinia).use(router).use(ElementPlus).mount('#app');
</script></body></html>
